# Estrutura da administração pública portuguesa.
# Fonte de partida: XXV Governo Constitucional (tomou posse em Junho de 2025).
# Os titulares e a orgânica mudam: confirmar em https://www.portugal.gov.pt e
# actualizar este ficheiro. Correr `python -m governo_sombra seed` depois de editar.
#
# Campos: id (slug único), nome, sigla, tipo, url, titular, descricao, filhos.
# Tipos: orgao_soberania, governo, ministerio, secretaria_estado, direcao_geral,
#        instituto, regulador, autoridade, empresa_publica, tribunal, inspecao,
#        forca_seguranca, outro
meta:
  legislatura: XVII
  governo: XXV Governo Constitucional
  dados_a: "2026-09-03"
  aviso: "Titulares e orgânica devem ser confirmados nas fontes oficiais."

entidades:
  # ------------------------------------------------------------------
  # ÓRGÃOS DE SOBERANIA E ENTIDADES INDEPENDENTES
  # ------------------------------------------------------------------
  - id: presidencia-republica
    nome: Presidência da República
    sigla: PR
    tipo: orgao_soberania
    url: https://www.presidencia.pt
    titular: António José Seguro
    descricao: Presidente da República. Promulga ou veta diplomas, nomeia o Primeiro-Ministro, pode dissolver a Assembleia.

  - id: assembleia-republica
    nome: Assembleia da República
    sigla: AR
    tipo: orgao_soberania
    url: https://www.parlamento.pt
    titular: José Pedro Aguiar-Branco (Presidente da AR)
    descricao: Parlamento. Aprova leis, o Orçamento do Estado e fiscaliza o Governo. Comissões parlamentares, plenário, petições.
    filhos:
      - id: ar-comissoes
        nome: Comissões Parlamentares
        tipo: outro
        url: https://www.parlamento.pt/sites/COM/Paginas/default.aspx
        descricao: Comissões permanentes e eventuais onde a maior parte do trabalho legislativo acontece antes do plenário.
      - id: ar-peticoes
        nome: Petições à Assembleia da República
        tipo: outro
        url: https://www.parlamento.pt/Peticoes
        descricao: Petições públicas que os cidadãos podem subscrever e acompanhar.

  - id: tribunal-constitucional
    nome: Tribunal Constitucional
    sigla: TC
    tipo: tribunal
    url: https://www.tribunalconstitucional.pt
    descricao: Fiscaliza a constitucionalidade das leis. Acórdãos publicados no DR.

  - id: supremo-tribunal-justica
    nome: Supremo Tribunal de Justiça
    sigla: STJ
    tipo: tribunal
    url: https://www.stj.pt
  - id: supremo-tribunal-administrativo
