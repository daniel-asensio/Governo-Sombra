    sigla: STA
    tipo: tribunal
    url: https://www.stadministrativo.pt
  - id: tribunal-contas
    nome: Tribunal de Contas
    sigla: TdC
    tipo: tribunal
    url: https://www.tcontas.pt
    descricao: Fiscaliza a legalidade das despesas públicas. Relatórios de auditoria e pareceres sobre a Conta Geral do Estado.
  - id: procuradoria-geral-republica
    nome: Procuradoria-Geral da República
    sigla: PGR
    tipo: outro
    url: https://www.ministeriopublico.pt
