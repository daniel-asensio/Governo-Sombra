# Fontes de informação por entidade.
# tipo: rss | html | dre | parlamento_iniciativas | json
# `verificada: true` = confirmado a partir de um servidor real. `activa: false` = URL por confirmar
# (usar 'diagnosticar' na página Fontes). Correr `python -m governo_sombra seed` depois de editar.
fontes:
- id: dre-serie-1
  entidade: diario-republica
  nome: Diário da República - 1.ª série (legislação)
  tipo: dre
  url: https://diariodarepublica.pt/dr/home
  config:
    serie: 1
  verificada: false
  prioridade: 10
- id: dre-serie-2
  entidade: diario-republica
  nome: Diário da República - 2.ª série (actos, concursos, nomeações)
