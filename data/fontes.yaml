# Fontes de informação por entidade.
# tipo: rss | html | dre | parlamento_iniciativas | parlamento_agenda | json
# Para fontes html, `config.selectores` define como extrair itens da página.
# `verificada: false` significa que o URL foi apontado de memória e ainda não foi
# confirmado a partir deste projecto. Correr `python -m governo_sombra descobrir`
# para tentar detectar feeds RSS automaticamente a partir do site de cada entidade,
# e `python -m governo_sombra ingest --fonte <id>` para testar uma fonte.
fontes:
  # --- Publicações oficiais ---------------------------------------------
  - id: dre-serie-1
    entidade: diario-republica
    nome: Diário da República - 1.ª série (legislação)
    tipo: dre
    url: https://diariodarepublica.pt/dr/home
    config: {serie: 1}
    verificada: false
    prioridade: 10
  - id: dre-serie-2
    entidade: diario-republica
    nome: Diário da República - 2.ª série (actos, concursos, nomeações)
    tipo: dre
    url: https://diariodarepublica.pt/dr/home
    config: {serie: 2}
    verificada: false
    prioridade: 6

  # --- Assembleia da República --------------------------------------------
  - id: ar-iniciativas
    entidade: assembleia-republica
    nome: AR - Iniciativas legislativas (dados abertos)
    tipo: parlamento_iniciativas
    url: https://www.parlamento.pt/Cidadania/Paginas/DadosAbertos.aspx
    config:
      nota: "Substituir pelo URL do ficheiro JSON 'Iniciativas' da legislatura corrente, obtido na página de Dados Abertos."
    verificada: false
    prioridade: 9
  - id: ar-agenda
    entidade: assembleia-republica
    nome: AR - Agenda parlamentar
    tipo: html
    url: https://www.parlamento.pt/AgendaParlamentar
    config:
      selectores:
        item: ".agenda-item, .Agenda .item, article"
        titulo: "h3, h4, .titulo, a"
        link: "a"
        data: ".data, time, .date"
        resumo: "p, .descricao"
    verificada: false
    prioridade: 8
  - id: ar-noticias
    entidade: assembleia-republica
    nome: AR - Notícias
    tipo: html
    url: https://www.parlamento.pt/Paginas/Noticias.aspx
    config:
      selectores:
        item: ".noticia, .news-item, article, .row.item"
        titulo: "h3, h4, a"
        link: "a"
        data: ".data, time"
        resumo: "p"
    verificada: false
    prioridade: 5

