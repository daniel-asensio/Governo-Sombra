[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governo-sombra"
version = "0.1.0"
description = "Observatório da administração pública portuguesa com governo sombra"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "feedparser>=6.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "apscheduler>=3.10,<4",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ia = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
governo-sombra = "governo_sombra.__main__:main"

[tool.setuptools.packages.find]
include = ["governo_sombra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
