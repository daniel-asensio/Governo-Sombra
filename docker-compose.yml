# Para um servidor próprio, VPS, Raspberry Pi ou VM gratuita da Oracle Cloud:
#   GS_PASSWORD='senha' docker compose up -d        (ou põe GS_PASSWORD num ficheiro .env)
# Depois abre http://<ip-do-servidor>:8000
# Com HTTPS e domínio: ver docker-compose.https.yml ou scripts/instalar-servidor.sh
services:
  governo-sombra:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - dados:/data
    environment:
      GS_PASSWORD: ${GS_PASSWORD:-muda-esta-senha}
      GS_INGEST_INTERVAL_MIN: "60"
      # ANTHROPIC_API_KEY: ...
      # GS_SMTP_HOST: ...
    restart: unless-stopped
volumes:
  dados:
