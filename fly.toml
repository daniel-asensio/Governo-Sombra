# Fly.io: `fly launch --copy-config --no-deploy`, depois `fly volumes create dados --size 1`,
# `fly secrets set GS_PASSWORD=...` e `fly deploy`.
app = "governo-sombra"
primary_region = "mad"

[build]

[env]
  GS_DATABASE_URL = "sqlite:////data/governo_sombra.db"
  GS_HOST = "0.0.0.0"
  GS_SCHEDULER = "1"
  GS_INGEST_INTERVAL_MIN = "60"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "dados"
  destination = "/data"
